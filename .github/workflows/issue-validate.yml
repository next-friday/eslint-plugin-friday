name: Issue Validation

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-validate-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  title:
    name: Validate issue title against Hybrid Convention
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ github.event.issue.user.type != 'Bot' }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/common-actions/bootstrap
      - name: Title follows the Hybrid Convention
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: echo "$ISSUE_TITLE" | pnpm exec commitlint
      - name: Title avoids the '+' shorthand
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$ISSUE_TITLE" == *"+"* ]]; then
            echo "::error::Issue title uses '+' shorthand; write 'and' or commas." >&2
            exit 1
          fi
      - name: Tag with status:needs-issue-title-fix on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue edit "$ISSUE" --repo "$REPO" --add-label "status:needs-issue-title-fix"
      - name: Clear status:needs-issue-title-fix on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:needs-issue-title-fix" 2>/dev/null || true
      - name: Apply the type label from the title
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/label-issue-by-type.sh
