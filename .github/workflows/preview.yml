name: Preview release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  preview:
    name: Publish preview package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/common-actions/bootstrap
      - run: pnpm build
      - run: pnpm dlx pkg-pr-new publish './packages/eslint-plugin-friday'
